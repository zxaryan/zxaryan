
<header
  class="sticky top-0 z-50 w-full border-b border-border
         bg-bg/90 backdrop-blur-xl"
>
  <nav
    class="mx-auto flex h-16 max-w-7xl items-center justify-between
           px-4 sm:px-6 lg:px-8"
    aria-label="Main navigation"
  >
    <!-- Brand -->
    <a
      routerLink="/"
      class="text-xl font-bold tracking-tight text-text
             transition-colors hover:text-primary"
      aria-label="zxaryan home"
    >
      zxaryan<span class="text-primary">.</span>
    </a>

    <!-- Navigation links -->
    <div class="flex items-center gap-2 sm:gap-4 md:gap-6">

      <a
        routerLink="/"
        routerLinkActive="!text-primary bg-surface"
        [routerLinkActiveOptions]="{ exact: true }"
        class="rounded-lg px-3 py-2 text-sm font-medium
               text-muted transition-colors hover:text-text"
      >
        Home
      </a>

      <a
        routerLink="/skills"
        routerLinkActive="!text-primary bg-surface"
        class="rounded-lg px-3 py-2 text-sm font-medium
               text-muted transition-colors hover:text-text"
      >
        Skills
      </a>
      <a
        routerLink="/projects"
        routerLinkActive="!text-primary bg-surface"
        class="rounded-lg px-3 py-2 text-sm font-medium
               text-muted transition-colors hover:text-text"
      >
        Projects
      </a>
      <a
        routerLink="/contact"
        routerLinkActive="!border-primary !text-primary"
        class="rounded-lg border border-border px-4 py-2
               text-sm font-semibold text-text transition-colors
               hover:border-primary hover:text-primary"
      >
        Contact
      </a>

    </div>
  </nav>
</header>
